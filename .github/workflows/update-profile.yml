name: Update profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate README data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: FelpzSystem
        run: python3 scripts/generate_profile.py

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: FelpzSystem
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Commit profile changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update profile"
          add: "README.md dist/github-contribution-grid-snake.svg"
          default_author: github_actions

